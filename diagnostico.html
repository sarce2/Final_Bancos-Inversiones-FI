<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico · Panel de Fondos</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<style>
  :root{
    --g-800:#0A3A2B; --g-700:#0F5340; --g-600:#146B51; --lime:#9CC93F;
    --bg:#F3F6F3; --card:#fff; --ink:#10211B; --ink-2:#4F6159; --ink-3:#84988E;
    --line:#DCE6DF; --line-2:#EBF1EC;
    --ok:#1B7F4B; --mal:#B3261E; --medio:#8A6100;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:16px 14px 60px}
  header{background:linear-gradient(160deg,var(--g-800),var(--g-600));color:#fff;border-radius:14px;padding:18px}
  h1{margin:0;font-size:18px}
  header p{margin:6px 0 0;font-size:13px;color:rgba(255,255,255,.8)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .card h2{margin:0;padding:12px 15px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
           color:var(--g-700);background:#F4F9F5;border-bottom:1px solid var(--line-2)}
  .card .in{padding:13px 15px}
  .fila{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .fila:last-child{border-bottom:none}
  .ic{flex:0 0 auto;width:20px;height:20px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
  .ic.ok{background:var(--ok)} .ic.mal{background:var(--mal)} .ic.medio{background:var(--medio)} .ic.esp{background:var(--ink-3)}
  .txt{min-width:0;flex:1}
  .txt b{display:block;font-size:13.5px}
  .txt span{font-size:12.5px;color:var(--ink-2);word-break:break-word}
  code{background:#EEF3EF;padding:2px 6px;border-radius:5px;font-size:12px;word-break:break-all}
  pre{background:#0D1F19;color:#D7E5DC;padding:11px 13px;border-radius:9px;font-size:12px;overflow-x:auto;margin:8px 0 0}
  .verdict{border-radius:14px;padding:14px 16px;margin-top:12px;font-size:14px;line-height:1.6}
  .verdict.ok{background:#E7F5EC;border:1px solid #BEE2CC;color:#14532D}
  .verdict.mal{background:#FFF8E5;border:1px solid #F0E0B4;color:#7A5A12}
  .verdict b{display:block;margin-bottom:5px;font-size:15px}
  .copia{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .copia input{flex:1 1 260px;font:12px ui-monospace,Menlo,Consolas,monospace;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .copia button{border:0;background:var(--g-700);color:#fff;font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer}
  ol{margin:8px 0 0;padding-left:20px;font-size:13.5px}
  li{margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Diagnóstico del Panel de Fondos</h1>
    <p>Esta página prueba una por una las direcciones que usa el panel y dice cuál falla. No muestra saldos.</p>
  </header>

  <div class="card">
    <h2>Pruebas</h2>
    <div class="in" id="pruebas"></div>
  </div>

  <div id="veredicto"></div>

  <div class="card">
    <h2>Detalle técnico</h2>
    <div class="in"><pre id="log">…</pre></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* La misma URL que está en index.html y detalle.html */
  var ORIGEN_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcpCTzLKNkGf9YikuvFh44yyf0bV0N0xqYuy6hXKAuW8Gv6mM6q1cueIairVRxTg/pub?output=csv";
  var HOJA = "DATOS";

  var cont = document.getElementById('pruebas');
  var log = [];
  var filas = {};

  function fila(id, titulo){
    var f = document.createElement('div'); f.className = 'fila';
    var ic = document.createElement('div'); ic.className = 'ic esp'; ic.textContent = '…';
    var tx = document.createElement('div'); tx.className = 'txt';
    var b = document.createElement('b'); b.textContent = titulo;
    var s = document.createElement('span'); s.textContent = 'probando…';
    tx.appendChild(b); tx.appendChild(s);
    f.appendChild(ic); f.appendChild(tx); cont.appendChild(f);
    filas[id] = { ic:ic, s:s };
  }
  function marcar(id, estado, texto){
    var f = filas[id];
    f.ic.className = 'ic ' + estado;
    f.ic.textContent = estado === 'ok' ? '✓' : (estado === 'mal' ? '✕' : '!');
    f.s.textContent = texto;
    log.push('[' + estado + '] ' + id + ': ' + texto);
    document.getElementById('log').textContent = log.join('\n');
  }

  ['pagina', 'json', 'csv', 'hoja', 'doc'].forEach(function(id){});
  fila('pagina', '1. La página está servida por un servidor web');
  fila('json', '2. Se puede leer datos.json (el respaldo)');
  fila('csv', '3. Se puede leer la planilla publicada');
  fila('hoja', '4. La planilla devuelve la hoja ' + HOJA);
  fila('doc', '5. Se puede ver la lista de hojas del documento');

  // 1 ---------------------------------------------------------------
  if (location.protocol === 'file:'){
    marcar('pagina', 'mal', 'Estás abriendo el archivo con doble clic (file://). Así el navegador bloquea todo. Hay que abrirlo desde el link de GitHub Pages.');
  } else {
    marcar('pagina', 'ok', location.origin + location.pathname);
  }

  function traer(url){
    return fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now(), { cache:'no-store' })
      .then(function(r){
        if (!r.ok) throw new Error('el servidor respondió HTTP ' + r.status);
        return r.text();
      });
  }
  function motivo(e){
    var m = (e && e.message) ? e.message : String(e);
    if (/failed to fetch|networkerror|load failed/i.test(m)){
      return 'el navegador bloqueó el pedido (CORS) o no hay conexión';
    }
    return m;
  }

  var base = ORIGEN_CSV.split('/pub')[0];
  var resultados = { csv:null, hoja:null, gid:null };

  // 2 ---------------------------------------------------------------
  traer('datos.json')
    .then(function(t){
      JSON.parse(t);
      marcar('json', 'ok', 'se leyó bien (' + t.length + ' caracteres)');
    })
    .catch(function(e){ marcar('json', 'mal', motivo(e) + '. ¿Subiste datos.json junto a esta página?'); })

  // 3 y 4 -----------------------------------------------------------
  .then(function(){ return traer(ORIGEN_CSV); })
  .then(function(txt){
    resultados.csv = txt;
    if (/^\s*</.test(txt)){
      marcar('csv', 'mal', 'la URL devolvió una página HTML, no un CSV: es el link de "compartir", no el de "publicar en la web"');
      marcar('hoja', 'mal', 'no se pudo leer ninguna hoja');
      return;
    }
    var primera = (txt.split('\n')[0] || '').slice(0, 70);
    marcar('csv', 'ok', 'respondió un CSV. Primera línea: ' + primera);

    var bajo = txt.toLowerCase();
    var esDatos = bajo.indexOf('seccion') >= 0 && bajo.indexOf('monto') >= 0 && bajo.indexOf('fondo') >= 0;
    if (esDatos){
      resultados.hoja = 'DATOS';
      marcar('hoja', 'ok', 'sí: la URL ya apunta a la hoja ' + HOJA + '. El panel debería andar perfecto.');
    } else {
      resultados.hoja = 'otra';
      marcar('hoja', 'medio', 'no: devuelve otra hoja (parece «' + primera.split(',')[0] + '»). El panel va a intentar encontrar la hoja ' + HOJA + ' solo.');
    }
  })
  .catch(function(e){
    marcar('csv', 'mal', motivo(e));
    marcar('hoja', 'mal', 'no se pudo probar');
  })

  // 5 ---------------------------------------------------------------
  .then(function(){
    if (resultados.hoja === 'DATOS'){
      marcar('doc', 'ok', 'no hace falta: la URL ya trae la hoja correcta');
      return;
    }
    if (!base || base === ORIGEN_CSV){
      marcar('doc', 'mal', 'la URL no tiene la forma esperada .../pub?...');
      return;
    }
    var urls = [base + '/pubhtml', base + '/pub?output=html'];
    var cadena = Promise.reject(new Error('inicio'));
    urls.forEach(function(u){
      cadena = cadena.catch(function(){ return traer(u); });
    });
    return cadena.then(function(html){
      var re = /gid=(\d+)[^>]*>([^<]{1,80})</g, m, hojas = [];
      while ((m = re.exec(html))){
        var n = m[2].trim();
        if (n && hojas.indexOf(n) < 0){
          hojas.push(n);
          if (n.toLowerCase() === HOJA.toLowerCase()) resultados.gid = m[1];
        }
      }
      if (resultados.gid){
        marcar('doc', 'ok', 'sí. Hojas publicadas: ' + hojas.join(', ') + '. La hoja ' + HOJA + ' tiene gid ' + resultados.gid + '.');
      } else if (hojas.length){
        marcar('doc', 'medio', 'se ve el documento pero no está la hoja ' + HOJA + '. Hojas publicadas: ' + hojas.join(', '));
      } else {
        marcar('doc', 'medio', 'se leyó el documento pero no se reconocieron hojas adentro');
      }
    }).catch(function(e){
      marcar('doc', 'mal', motivo(e));
    });
  })

  // veredicto -------------------------------------------------------
  .then(function(){
    var v = document.getElementById('veredicto');
    var box = document.createElement('div');
    var t = document.createElement('b');
    var p = document.createElement('div');

    if (resultados.hoja === 'DATOS'){
      box.className = 'verdict ok';
      t.textContent = 'Todo en orden';
      p.textContent = 'La URL devuelve la hoja ' + HOJA + '. Si el panel igual no muestra números, el problema está en los datos de la planilla, no en la conexión.';
      box.appendChild(t); box.appendChild(p);
    } else if (resultados.gid){
      box.className = 'verdict ok';
      t.textContent = 'Encontré la hoja ' + HOJA;
      p.textContent = 'Pegá esta URL en la línea ORIGEN_CSV de index.html y detalle.html, y el panel va a leer la hoja correcta de una:';
      box.appendChild(t); box.appendChild(p);
      var url = base + '/pub?gid=' + resultados.gid + '&single=true&output=csv';
      var d = document.createElement('div'); d.className = 'copia';
      var inp = document.createElement('input'); inp.readOnly = true; inp.value = url;
      var btn = document.createElement('button'); btn.textContent = 'Copiar';
      btn.onclick = function(){
        inp.select();
        try{ document.execCommand('copy'); btn.textContent = 'Copiado'; }catch(e){ btn.textContent = 'Copialo a mano'; }
      };
      d.appendChild(inp); d.appendChild(btn);
      box.appendChild(d);
    } else {
      box.className = 'verdict mal';
      t.textContent = 'Hay que republicar la planilla';
      p.textContent = 'No se pudo llegar a la hoja ' + HOJA + '. En Google Sheets, con la planilla abierta:';
      box.appendChild(t); box.appendChild(p);
      var ol = document.createElement('ol');
      ['Archivo → Compartir → Publicar en la web',
       'En el primer desplegable, elegí la hoja ' + HOJA + ' (no "Todo el documento")',
       'En el segundo, "Valores separados por comas (.csv)"',
       'Publicar, y copiar la URL que aparece (lleva gid y single=true)',
       'Pegarla en la línea ORIGEN_CSV de index.html y detalle.html'
      ].forEach(function(x){ var li = document.createElement('li'); li.textContent = x; ol.appendChild(li); });
      box.appendChild(ol);
    }
    v.appendChild(box);
  });
})();
</script>
</body>
</html>
