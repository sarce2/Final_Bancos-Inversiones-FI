<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen por empresa · Panel de Fondos</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0A3A2B">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%239CC93F'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='bold' text-anchor='middle' fill='%2306251C'%3EPF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --g-900:#06251C; --g-800:#0A3A2B; --g-700:#0F5340; --g-600:#146B51;
    --lime:#9CC93F;
    --page:#F3F6F3; --surface:#FFFFFF; --surface-2:#F4F9F5;
    --ink:#10211B; --ink-2:#4F6159; --ink-3:#84988E;
    --line:#DCE6DF; --line-2:#EBF1EC; --track:#EDF2EE;
    --serie-bancos:#2a78d6;      /* categórico slot 1 */
    --serie-inversiones:#eb6834; /* categórico slot 2 */
    --label-en-fill:#FFFFFF;
    --radius:14px;
    --shadow:0 1px 2px rgba(6,37,28,.05), 0 8px 24px rgba(6,37,28,.06);
    --ring:rgba(16,33,27,.10);
  }
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])){
      color-scheme:dark;
      --g-900:#061411; --g-800:#0C2A21; --g-700:#154536; --g-600:#1C5B47;
      --lime:#B6DE62;
      --page:#0A1310; --surface:#11201B; --surface-2:#16271F;
      --ink:#EAF0EC; --ink-2:#B5C6BC; --ink-3:#8DA399;
      --line:#223A30; --line-2:#1B3026; --track:#1C2F27;
      --serie-bancos:#3987e5;
      --serie-inversiones:#d95926;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --ring:rgba(255,255,255,.10);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.45;
  }
  .wrap{max-width:980px;margin:0 auto;padding:16px 14px 72px}

  /* ---------- encabezado ---------- */
  header.top{
    background:linear-gradient(160deg,var(--g-800) 0%,var(--g-700) 58%,var(--g-600) 100%);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:18px 18px 16px; margin-bottom:12px; color:#fff;
    position:relative; overflow:hidden;
  }
  header.top::after{
    content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;
    border-radius:50%;background:rgba(156,201,63,.14);pointer-events:none;
  }
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mark{
    width:30px;height:30px;border-radius:8px;flex:0 0 auto;background:var(--lime);
    display:grid;place-items:center;font-weight:800;font-size:14px;color:#06251C;letter-spacing:-.02em;
  }
  h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
  .sub{font-size:11.5px;color:rgba(255,255,255,.66);margin-top:1px}
  .stamp{font-size:11.5px;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
  .meta{display:flex;align-items:center;gap:11px;flex-wrap:wrap;justify-content:flex-end}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;
    padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.16);color:rgba(255,255,255,.9);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* ---------- tarjetas ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .card > h2{
    font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--g-700);
    margin:0;padding:13px 16px 11px;border-bottom:1px solid var(--line-2);background:var(--surface-2);
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])) .card > h2{color:var(--lime)}
  }
  .card > h2 .hint{font-size:10.5px;font-weight:550;letter-spacing:0;text-transform:none;color:var(--ink-3)}
  .pad{padding:14px 16px 16px}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px}
  .kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
  .kpi .v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:5px;color:var(--ink)}
  .kpi .s{font-size:11.5px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
  .meter{height:5px;border-radius:999px;background:var(--track);margin-top:9px;overflow:hidden}
  .meter > i{display:block;height:100%;border-radius:999px;background:var(--g-600)}
  @media (max-width:860px){ .kpis{grid-template-columns:repeat(2,1fr)} }

  /* ---------- gráfico de barras ---------- */
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-2);font-weight:600}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .sw-b{background:var(--serie-bancos)}
  .sw-i{background:var(--serie-inversiones)}

  .bars{display:flex;flex-direction:column;gap:14px}
  .barrow{display:grid;grid-template-columns:1fr;gap:5px}
  .barhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .barhead .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barhead .nm em{font-style:normal;font-weight:500;color:var(--ink-3);font-size:11.5px;margin-left:5px}
  .barhead .tot{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .barhead .pct{font-size:11.5px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-left:7px}
  .track{position:relative;height:14px;background:var(--track);border-radius:5px;display:flex;overflow:hidden}
  .seg{height:100%;border:0;padding:0;cursor:default;position:relative;outline:none;min-width:4px}
  .seg.b{background:var(--serie-bancos)}
  .seg.i{background:var(--serie-inversiones)}
  /* separación de 2px entre segmentos, hecha con el color de la superficie */
  .seg + .seg{box-shadow:-2px 0 0 0 var(--surface)}
  .seg:first-child{border-radius:5px 0 0 5px}
  .seg:last-child{border-radius:0 5px 5px 0}
  .seg:only-child{border-radius:5px}
  .seg:hover,.seg:focus-visible{filter:brightness(1.08)}
  .seg:focus-visible{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink-3)}
  .vacio{font-size:13px;color:var(--ink-3);padding:6px 0 2px}
  .grupo{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink-3);margin:0 0 9px}
  .grupo.sep{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2)}

  #tip{
    position:fixed;z-index:50;pointer-events:none;opacity:0;transform:translateY(-4px);
    transition:opacity .1s;background:var(--g-900);color:#fff;border-radius:9px;
    padding:8px 11px;font-size:12px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.25);
    max-width:260px;
  }
  #tip b{display:block;font-size:12.5px;margin-bottom:2px}
  #tip .n{font-variant-numeric:tabular-nums}
  #tip.on{opacity:1;transform:translateY(0)}

  /* ---------- tabla ---------- */
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:11px 16px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--g-700);font-weight:700;background:var(--surface-2)}
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])) th{color:var(--lime)}
  }
  th:first-child,td:first-child{text-align:left;white-space:normal}
  td{font-variant-numeric:tabular-nums}
  td.nm{font-weight:600}
  tbody tr:hover td{background:var(--surface-2)}
  tr.tot td{border-bottom:none;border-top:2px solid var(--g-600);font-weight:750;background:var(--g-800);color:#fff}
  tr.tot:hover td{background:var(--g-800)}
  tr.tot td:last-child{color:var(--lime)}
  tr.nil td{color:var(--ink-3)}
  /* en pantallas angostas la tabla se desliza: el nombre de la empresa queda fijo */
  @media (max-width:640px){
    th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
    thead th:first-child{background:var(--surface-2)}
    tbody tr:hover td:first-child{background:var(--surface-2)}
    tr.tot td:first-child{background:var(--g-800)}
  }

  /* ---------- detalle por empresa ---------- */
  .emps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (max-width:760px){ .emps{grid-template-columns:1fr} }
  .emp{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .emp > .eh{padding:13px 15px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
  .emp .en{font-size:14px;font-weight:700;letter-spacing:-.01em}
  .emp .ev{font-size:18px;font-weight:750;letter-spacing:-.02em;margin-top:3px}
  .emp .es{font-size:11.5px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
  .emp .grp{padding:10px 15px 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:7px}
  .emp .ln{display:flex;justify-content:space-between;gap:10px;padding:7px 15px;font-size:13px;border-bottom:1px solid var(--line-2)}
  .emp .ln:last-child{border-bottom:none}
  .emp .ln .l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .emp .ln .r{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
  .emp .none{padding:7px 15px 12px;font-size:12.5px;color:var(--ink-3);font-style:italic}
  .emp .ef{margin-top:auto;padding:10px 15px;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-2)}
  .emp .ef b{font-variant-numeric:tabular-nums;color:var(--ink)}

  .err{background:#FFF8E5;border:1px solid #F0E0B4;color:#7A5A12;border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-bottom:12px;line-height:1.5}
  .err b{display:block;margin-bottom:3px}
  .err code{background:rgba(122,90,18,.1);padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])) .err{background:#2A2208;border-color:#5A4A14;color:#F0DFA8}
    :root:where(:not([data-theme="light"])) .err code{background:rgba(240,223,168,.12)}
  }
  footer.foot{font-size:11.5px;color:var(--ink-3);text-align:center;padding:10px 4px 0;line-height:1.7}
  footer.foot a{color:var(--g-600);font-weight:600}
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])) footer.foot a{color:var(--lime)}
  }
  #boot{padding:48px 16px;text-align:center;color:var(--ink-3);font-size:14px}

  @media (max-width:560px){
    .wrap{padding:12px 11px 72px}
    header.top{padding:16px 14px 14px}
    .kpis{gap:10px}
    .kpi{padding:11px 12px}
    .kpi .v{font-size:18px}
    th,td{padding:10px 11px;font-size:13px}
    .pad{padding:12px 13px 14px}
  }
  @media print{
    body{background:#fff}
    .card,header.top,.kpi,.emp{box-shadow:none}
    #tip{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <div class="brand">
        <div class="mark">PF</div>
        <div>
          <h1>Resumen por empresa</h1>
          <div class="sub">Panel de Fondos · bancos e inversiones de cada empresa</div>
        </div>
      </div>
      <div class="meta">
        <span class="stamp" id="stamp"></span>
        <span class="pill"><span class="dot"></span><span>Sólo lectura</span></span>
      </div>
    </div>
  </header>

  <main id="view"><div id="boot">Cargando datos…</div></main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="tip" role="tooltip" aria-hidden="true"></div>

<script>
/* Datos de respaldo opcionales: se usan sólo si no se puede leer ni la planilla
   ni datos.json (por ejemplo al abrir el archivo con doble clic, sin servidor). */
window.DATOS_RESPALDO = null;
</script>

<script>
(function(){
  "use strict";

  /* =======================================================================
     ORIGEN DE LOS DATOS  —  es lo único que se edita en este archivo.

     Pegá acá, entre las comillas, la URL que te da Google Sheets en
     Archivo → Compartir → Publicar en la web
       → primer desplegable: la hoja DATOS   (NO "Todo el documento")
       → segundo desplegable: Valores separados por comas (.csv)
       → Publicar, y copiar la URL.

     Tiene que verse así, con gid y single=true:
     https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?gid=123456789&single=true&output=csv

     Si la URL no lleva gid, Google devuelve la PRIMERA hoja del documento
     ("Consolidado"): la página se da cuenta, busca sola la hoja DATOS y
     muestra un aviso hasta que la corrijas.

     Dejala vacía ("") si querés que la página use sólo datos.json.
     ======================================================================= */

  var ORIGEN_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcpCTzLKNkGf9YikuvFh44yyf0bV0N0xqYuy6hXKAuW8Gv6mM6q1cueIairVRxTg/pub?output=csv";

  /* Nombre de la pestaña de la planilla que tiene los datos. */
  var HOJA = "DATOS";

  /* Link al panel con el detalle fondo por fondo. Si no lo vas a subir,
     dejalo vacío ("") y el enlace del pie desaparece. */
  var LINK_DETALLE = "detalle.html";

  ORIGEN_CSV = String(ORIGEN_CSV).trim();

  var SLOTS = 3;
  var state = null;
  var aviso = "";
  var origen = "";

  var fmtPyg = new Intl.NumberFormat('es-PY', { maximumFractionDigits:0 });
  // mismo criterio que los guaraníes: punto para los miles, coma para los decimales
  var fmtUsd = new Intl.NumberFormat('es-PY', { minimumFractionDigits:2, maximumFractionDigits:2 });
  var fmtPct = new Intl.NumberFormat('es-PY', { minimumFractionDigits:1, maximumFractionDigits:1 });

  function gs(n){ return 'Gs. ' + fmtPyg.format(Math.round(Number(n) || 0)); }
  function usd(n){ return 'US$ ' + fmtUsd.format(Number(n) || 0); }
  function money(n, cur){ return cur === 'USD' ? usd(n) : gs(n); }
  function curTag(c){ return c === 'USD' ? 'USD' : 'Gs.'; }
  function pct(part, total){ return total ? fmtPct.format(part / total * 100) + '%' : '—'; }
  function rate(){ return Number(state && state.fx && state.fx.rate) || 0; }

  /* Un tipo de cambio real de guaraníes por dólar está en los miles. Si la
     planilla trae 0, 1, o cualquier número chico, es que no se está
     convirtiendo nada: la página muestra cada monto en su moneda original
     en vez de sumar dólares con guaraníes a una cotización que no existe. */
  var TC_MINIMO = 100;
  function sinTc(){ return !(rate() >= TC_MINIMO); }
  function mixto(t){
    if (!t.pyg && !t.usd) return '—';
    if (!t.usd) return gs(t.pyg);
    if (!t.pyg) return usd(t.usd);
    return gs(t.pyg) + '  +  ' + usd(t.usd);
  }
  /* El total de una empresa se muestra siempre en su moneda: un fondo en
     dólares no se convierte a guaraníes sólo porque haya tipo de cambio. */
  function totalDe(t){ return mixto(t); }
  function corto(n){
    n = Math.round(Number(n) || 0);
    if (Math.abs(n) >= 1e9) return fmtPct.format(n / 1e9) + ' mil M';
    if (Math.abs(n) >= 1e6) return fmtPct.format(n / 1e6) + ' M';
    return fmtPyg.format(n);
  }

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fmtDate(iso, withTime){
    var d = new Date(iso);
    if (!iso || isNaN(d)) return '';
    var o = { timeZone:'America/Asuncion', day:'2-digit', month:'2-digit', year:'numeric' };
    if (withTime){ o.hour = '2-digit'; o.minute = '2-digit'; o.hour12 = false; }
    try{ return d.toLocaleString('es-PY', o); }catch(e){ return d.toLocaleDateString(); }
  }

  /* ---------- normalización defensiva del JSON ---------- */
  function normRows(rows, def, prefix){
    var out = [];
    var n = Math.max(SLOTS, (Array.isArray(rows) ? rows.length : 0));
    for (var k = 0; k < n; k++){
      var r = (Array.isArray(rows) && rows[k]) || {};
      var c = r.currency === 'USD' ? 'USD' : (r.currency === 'PYG' ? 'PYG' : def);
      out.push({
        label: typeof r.label === 'string' ? r.label : '',
        amount: Number(r.amount) || 0,
        currency: c,
        ph: prefix + ' ' + (k + 1)
      });
    }
    return out;
  }
  function normalize(raw){
    if (!raw || typeof raw !== 'object') throw new Error('datos vacíos');
    var fondos = Array.isArray(raw.fondos) ? raw.fondos : [];
    if (!fondos.length) throw new Error('sin fondos');
    return {
      actualizado: typeof raw.actualizado === 'string' ? raw.actualizado : '',
      fx: {
        rate: Number(raw.fx && raw.fx.rate) || 0,
        source: (raw.fx && typeof raw.fx.source === 'string') ? raw.fx.source : '',
        asOf: (raw.fx && typeof raw.fx.asOf === 'string') ? raw.fx.asOf : ''
      },
      fondos: fondos.map(function(f, i){
        var cur = f.moneda === 'USD' ? 'USD' : 'PYG';
        return {
          id: typeof f.id === 'string' && f.id ? f.id : ('fondo-' + (i + 1)),
          nombre: typeof f.nombre === 'string' ? f.nombre : ('Empresa ' + (i + 1)),
          moneda: cur,
          bancos: normRows(f.bancos, cur, 'Banco'),
          inversiones: normRows(f.inversiones, cur, 'Fondo mutuo')
        };
      })
    };
  }

  /* ---------- lectura de la planilla (CSV) ---------- */
  function parseCSV(text){
    var rows = [], row = [], cur = '', q = false, i = 0;
    text = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    while (i < text.length){
      var ch = text.charAt(i);
      if (q){
        if (ch === '"'){
          if (text.charAt(i + 1) === '"'){ cur += '"'; i += 2; continue; }
          q = false; i++; continue;
        }
        cur += ch; i++; continue;
      }
      if (ch === '"'){ q = true; i++; continue; }
      if (ch === ','){ row.push(cur); cur = ''; i++; continue; }
      if (ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; i++; continue; }
      cur += ch; i++;
    }
    if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  function parseMonto(str, cur){
    if (str == null) return 0;
    var s = String(str).trim().replace(/[^0-9.,-]/g, '');
    if (!s) return 0;
    var neg = s.charAt(0) === '-';
    s = s.replace(/-/g, '');
    var val;
    if (cur === 'USD'){
      var cut = Math.max(s.lastIndexOf('.'), s.lastIndexOf(','));
      var tail = cut > -1 ? s.length - cut - 1 : -1;
      if (cut > -1 && tail > 0 && tail <= 2){
        val = Number(s.slice(0, cut).replace(/[^0-9]/g, '') + '.' + s.slice(cut + 1).replace(/[^0-9]/g, ''));
      } else {
        val = Number(s.replace(/[^0-9]/g, ''));
      }
    } else {
      val = Number(s.replace(/[^0-9]/g, ''));
    }
    if (!isFinite(val) || val === 0) return 0;
    return neg ? -val : val;
  }

  function slug(s){
    var t = String(s).toLowerCase();
    if (t.normalize) t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return t.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  function parseFecha(s){
    s = (s || '').trim();
    if (!s) return null;
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0);
    m = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(s);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1], 12, 0, 0);
    var d = new Date(s);
    return isNaN(d) ? null : d;
  }
  function limpiarNombre(s){
    return String(s).replace(/\s*\((USD|US\$|Gs\.?|PYG|G\$)\)\s*$/i, '').trim();
  }

  function fromCsv(text){
    var rows = parseCSV(text);
    var cfg = {}, head = -1, cols = null;
    // La fila de encabezados es la que tiene fondo + seccion + monto a la vez.
    for (var i = 0; i < rows.length; i++){
      var celdas = rows[i].map(function(h){ return (h || '').trim().toLowerCase(); });
      if (celdas.indexOf('fondo') >= 0 && celdas.indexOf('seccion') >= 0 && celdas.indexOf('monto') >= 0){
        head = i; cols = celdas; break;
      }
      if (celdas[0]) cfg[celdas[0]] = (rows[i][1] || '').trim();
    }
    if (head < 0){
      var e = new Error('la hoja que devolvió la URL no tiene las columnas fondo/seccion/monto');
      e.codigo = 'hoja-incorrecta';
      e.primera = ((rows[0] && rows[0][0]) || '').trim().slice(0, 60);
      throw e;
    }

    function idx(name){ return cols.indexOf(name); }
    var iF = idx('fondo'), iMf = idx('moneda_fondo'), iS = idx('seccion'),
        iN = idx('nombre'), iM = idx('moneda'), iA = idx('monto');

    var orden = [], mapa = {};
    for (var r = head + 1; r < rows.length; r++){
      var fila = rows[r];
      var nombreFondo = (fila[iF] || '').trim();
      if (!nombreFondo) continue;
      var sec = (fila[iS] || '').trim().toLowerCase();
      var esBanco = sec.indexOf('banco') === 0;
      var esInv = sec.indexOf('inv') === 0;
      if (!esBanco && !esInv) continue;
      var monedaFondo = ((iMf >= 0 ? fila[iMf] : '') || '').trim().toUpperCase();
      monedaFondo = (monedaFondo.indexOf('US') === 0) ? 'USD' : 'PYG';
      var limpio = limpiarNombre(nombreFondo);
      var id = slug(limpio) || ('fondo-' + orden.length);
      if (!mapa[id]){
        mapa[id] = { id:id, nombre:limpio, moneda:monedaFondo, bancos:[], inversiones:[] };
        orden.push(id);
      }
      var monedaFila = ((iM >= 0 ? fila[iM] : '') || '').trim().toUpperCase();
      var cur = monedaFila ? (monedaFila.indexOf('US') === 0 ? 'USD' : 'PYG') : monedaFondo;
      var destino = esInv ? mapa[id].inversiones : mapa[id].bancos;
      destino.push({
        label: ((iN >= 0 ? fila[iN] : '') || '').trim(),
        amount: parseMonto(fila[iA], cur),
        currency: cur
      });
    }
    if (!orden.length) throw new Error('la planilla no tiene filas de datos');

    var d = parseFecha(cfg['actualizado']) || new Date();

    return {
      actualizado: d.toISOString(),
      fx: {
        rate: parseMonto(cfg['tc'], 'PYG'),
        source: cfg['fuente'] || 'planilla de Google',
        asOf: d.toISOString()
      },
      fondos: orden.map(function(id){ return mapa[id]; })
    };
  }


  /* ---------------------------------------------------------------------
     Lectura de la hoja "Consolidado" (la primera del documento).
     Trae un total por empresa YA CONVERTIDO a guaraníes con el tipo de
     cambio de la celda B4. Se usa sólo si no se pudo llegar a la hoja
     DATOS: así la página muestra números correctos igual, aunque sin el
     detalle banco por banco.
     --------------------------------------------------------------------- */
  function fromConsolidado(text){
    var rows = parseCSV(text);
    var head = -1, tc = 0;
    for (var i = 0; i < rows.length; i++){
      var c0 = (rows[i][0] || '').trim().toLowerCase();
      if (c0.indexOf('tipo de cambio') === 0) tc = parseMonto(rows[i][1], 'PYG');
      if (c0 === 'fondo'){ head = i; break; }
    }
    if (head < 0) throw new Error('no reconozco la hoja que devolvió la URL');

    var fondos = [];
    for (var r = head + 1; r < rows.length; r++){
      var nombre = (rows[r][0] || '').trim();
      if (!nombre) continue;
      // la fila TOTAL y las instrucciones de abajo cierran la tabla
      if (/^total/i.test(nombre) || /^\d+\./.test(nombre)) break;
      if (nombre.toLowerCase().indexOf('como usar') === 0) break;
      var limpio = limpiarNombre(nombre);
      var cur = /\(\s*(USD|US\$)\s*\)/i.test(nombre) ? 'USD' : 'PYG';
      var mb = parseMonto(rows[r][1], 'PYG');
      var mi = parseMonto(rows[r][2], 'PYG');
      /* Esta hoja guarda todo convertido a guaraníes. Si el fondo es en dólares,
         se vuelve al monto original dividiendo por el mismo tipo de cambio que
         usó la planilla, así no se muestra un fondo en US$ etiquetado en Gs. */
      var monedaFila = 'PYG';
      if (cur === 'USD' && tc > 0){
        mb = mb / tc; mi = mi / tc; monedaFila = 'USD';
      }
      fondos.push({
        id: slug(limpio) || ('fondo-' + fondos.length),
        nombre: limpio,
        moneda: cur,
        bancos: [{ label:'Total en bancos', amount: mb, currency: monedaFila }],
        inversiones: [{ label:'Total en inversiones', amount: mi, currency: monedaFila }]
      });
    }
    if (!fondos.length) throw new Error('la hoja Consolidado no tiene filas de fondos');

    var d = new Date();
    return {
      actualizado: d.toISOString(),
      fx: { rate: tc, source: 'hoja Consolidado', asOf: d.toISOString() },
      fondos: fondos
    };
  }

  /* ---------- cálculos ---------- */
  function secTotals(rows){
    var t = { pyg:0, usd:0 };
    rows.forEach(function(r){
      if (r.currency === 'USD') t.usd += r.amount; else t.pyg += r.amount;
    });
    t.gs = t.pyg + t.usd * rate();
    return t;
  }
  function resumen(){
    var empresas = state.fondos.map(function(f){
      var b = secTotals(f.bancos), i = secTotals(f.inversiones);
      return {
        id: f.id, nombre: f.nombre, moneda: f.moneda,
        bancos: b, inversiones: i,
        pyg: b.pyg + i.pyg, usd: b.usd + i.usd,
        gs: b.gs + i.gs,
        filas: {
          bancos: f.bancos.filter(function(r){ return r.label || r.amount; }),
          inversiones: f.inversiones.filter(function(r){ return r.label || r.amount; })
        }
      };
    });
    var tot = { gs:0, pyg:0, usd:0, bancos:0, inversiones:0, conSaldo:0,
                bancosPyg:0, bancosUsd:0, invPyg:0, invUsd:0 };
    empresas.forEach(function(e){
      tot.gs += e.gs; tot.pyg += e.pyg; tot.usd += e.usd;
      tot.bancos += e.bancos.gs; tot.inversiones += e.inversiones.gs;
      tot.bancosPyg += e.bancos.pyg; tot.bancosUsd += e.bancos.usd;
      tot.invPyg += e.inversiones.pyg; tot.invUsd += e.inversiones.usd;
      // "con saldo" no puede depender de la conversión: se mira cada moneda
      if (e.pyg || e.usd) tot.conSaldo++;
    });
    // Sin tipo de cambio no hay un total comparable entre empresas:
    // se respeta el orden de la planilla en vez de inventar un ranking.
    var orden = sinTc()
      ? empresas.slice()
      : empresas.slice().sort(function(a, b){ return b.gs - a.gs; });
    return { empresas: empresas, ranking: orden, tot: tot, max: orden.length ? orden[0].gs : 0 };
  }

  /* ---------- tooltip ---------- */
  var tip = document.getElementById('tip');
  function tipShow(ev, titulo, lineas){
    tip.innerHTML = '';
    tip.appendChild(el('b', null, titulo));
    lineas.forEach(function(l){ tip.appendChild(el('div', 'n', l)); });
    tip.classList.add('on');
    tip.setAttribute('aria-hidden', 'false');
    tipMove(ev);
  }
  function tipMove(ev){
    var r = tip.getBoundingClientRect();
    var x = (ev.clientX != null ? ev.clientX : 20) + 14;
    var y = (ev.clientY != null ? ev.clientY : 20) - r.height - 12;
    if (x + r.width > window.innerWidth - 8) x = window.innerWidth - r.width - 8;
    if (y < 8) y = (ev.clientY != null ? ev.clientY : 20) + 18;
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top = y + 'px';
  }
  function tipHide(){
    tip.classList.remove('on');
    tip.setAttribute('aria-hidden', 'true');
  }
  window.addEventListener('scroll', tipHide, true);

  /* ---------- render ---------- */
  function paintHeader(){
    var R = resumen();
    var s = fmtDate(state.actualizado, true);
    document.getElementById('stamp').textContent = s ? 'Actualizado ' + s + ' hs' : '';
    return R;
  }

  function kpiEl(k, v, s, frac){
    var c = el('div', 'kpi');
    c.appendChild(el('div', 'k', k));
    c.appendChild(el('div', 'v', v));
    if (s) c.appendChild(el('div', 's', s));
    if (frac != null){
      var m = el('div', 'meter');
      var i = el('i');
      i.style.width = Math.max(0, Math.min(100, frac * 100)).toFixed(1) + '%';
      m.appendChild(i);
      c.appendChild(m);
    }
    return c;
  }

  /* Valor y subtítulo de un indicador cuando conviven las dos monedas */
  function kpiMoneda(pyg, usdVal, vacio){
    if (!pyg && !usdVal) return { v:'—', s:vacio };
    if (pyg && usdVal) return { v:gs(pyg), s:'+ ' + usd(usdVal) };
    return pyg ? { v:gs(pyg), s:vacio } : { v:usd(usdVal), s:vacio };
  }

  function kpisEl(R){
    var box = el('div', 'kpis');
    var t = R.tot;

    box.appendChild(kpiEl('Empresas con saldo',
      t.conSaldo + ' de ' + R.empresas.length,
      t.conSaldo === R.empresas.length ? 'todas cargadas' : (R.empresas.length - t.conSaldo) + ' sin saldos',
      R.empresas.length ? t.conSaldo / R.empresas.length : 0));

    if (sinTc()){
      // sin tipo de cambio no hay porcentajes del total: se muestran las dos monedas
      var kb = kpiMoneda(t.bancosPyg, t.bancosUsd, 'suma de las cuentas bancarias');
      var ki = kpiMoneda(t.invPyg, t.invUsd, 'suma de los fondos mutuos');
      box.appendChild(kpiEl('En bancos', kb.v, kb.s));
      box.appendChild(kpiEl('En inversiones', ki.v, ki.s));
      box.appendChild(kpiEl('En dólares', t.usd ? usd(t.usd) : '—',
        t.pyg ? 'y ' + gs(t.pyg) + ' en guaraníes' : 'sin saldos en guaraníes'));
    } else {
      box.appendChild(kpiEl('En bancos', gs(t.bancos),
        pct(t.bancos, t.gs) + ' del total', t.gs ? t.bancos / t.gs : 0));
      box.appendChild(kpiEl('En inversiones', gs(t.inversiones),
        pct(t.inversiones, t.gs) + ' del total', t.gs ? t.inversiones / t.gs : 0));
      box.appendChild(kpiEl('Exposición en dólares', usd(t.usd),
        t.gs ? pct(t.usd * rate(), t.gs) + ' del total' : '—',
        t.gs ? (t.usd * rate()) / t.gs : 0));
    }
    return box;
  }

  function leyenda(){
    var l = el('div', 'legend');
    var a = el('span'); a.appendChild(el('i', 'swatch sw-b')); a.appendChild(el('span', null, 'Bancos'));
    var b = el('span'); b.appendChild(el('i', 'swatch sw-i')); b.appendChild(el('span', null, 'Inversiones'));
    l.appendChild(a); l.appendChild(b);
    return l;
  }

  /* items: [{ nombre, moneda, b, i, total }] ya ordenados y en UNA sola moneda */
  function barrasDe(items, max, total, fmt){
    var bars = el('div', 'bars');
    items.forEach(function(e){
      var row = el('div', 'barrow');

      var head = el('div', 'barhead');
      head.appendChild(el('div', 'nm', e.nombre));
      var tot = el('div', 'tot', fmt(e.total));
      tot.appendChild(el('span', 'pct', pct(e.total, total)));
      head.appendChild(tot);
      row.appendChild(head);

      var track = el('div', 'track');
      [['b', 'Bancos', e.b], ['i', 'Inversiones', e.i]].forEach(function(p){
        var v = p[2];
        if (v <= 0) return;
        var seg = document.createElement('button');
        seg.type = 'button';
        seg.className = 'seg ' + p[0];
        seg.style.width = (v / max * 100) + '%';
        seg.setAttribute('tabindex', '0');
        var lineas = [p[1] + ': ' + fmt(v), pct(v, e.total) + ' de ' + e.nombre];
        seg.setAttribute('aria-label', e.nombre + ' · ' + lineas.join(' · '));
        seg.onmouseenter = function(ev){ tipShow(ev, e.nombre, lineas); };
        seg.onmousemove = tipMove;
        seg.onmouseleave = tipHide;
        seg.onfocus = function(){
          var r = seg.getBoundingClientRect();
          tipShow({ clientX:r.left + r.width / 2, clientY:r.top }, e.nombre, lineas);
        };
        seg.onblur = tipHide;
        track.appendChild(seg);
      });
      row.appendChild(track);
      bars.appendChild(row);
    });
    return bars;
  }

  function grupoMoneda(R, campo){
    var items = R.empresas.map(function(e){
      return {
        nombre: e.nombre, moneda: null,
        b: e.bancos[campo], i: e.inversiones[campo],
        total: e.bancos[campo] + e.inversiones[campo]
      };
    }).filter(function(x){ return x.total > 0; })
      .sort(function(a, b){ return b.total - a.total; });
    var total = 0, max = 0;
    items.forEach(function(x){ total += x.total; if (x.total > max) max = x.total; });
    return { items: items, total: total, max: max };
  }

  function barrasEl(R){
    var card = el('div', 'card');
    var h = el('h2', null, 'Total por empresa');
    if (!sinTc()) h.appendChild(el('span', 'hint', 'comparadas en guaraníes al TC ' + fmtPyg.format(Math.round(rate()))));
    h.appendChild(leyenda());
    card.appendChild(h);
    var pad = el('div', 'pad');

    if (sinTc()){
      // dos rankings separados: guaraníes y dólares no se mezclan sin cotización
      var g = grupoMoneda(R, 'pyg'), u = grupoMoneda(R, 'usd');
      if (!g.items.length && !u.items.length){
        pad.appendChild(el('div', 'vacio', 'Todavía no hay saldos cargados en la planilla, así que no hay nada para comparar.'));
        card.appendChild(pad);
        return card;
      }
      if (g.items.length){
        pad.appendChild(el('div', 'grupo', 'En guaraníes'));
        pad.appendChild(barrasDe(g.items, g.max, g.total, gs));
      }
      if (u.items.length){
        pad.appendChild(el('div', 'grupo' + (g.items.length ? ' sep' : ''), 'En dólares'));
        pad.appendChild(barrasDe(u.items, u.max, u.total, usd));
      }
      card.appendChild(pad);
      return card;
    }

    if (!R.max){
      pad.appendChild(el('div', 'vacio', 'Todavía no hay saldos cargados en la planilla, así que no hay nada para comparar.'));
      card.appendChild(pad);
      return card;
    }

    var items = R.ranking.map(function(e){
      return { nombre:e.nombre, moneda:e.moneda, b:e.bancos.gs, i:e.inversiones.gs, total:e.gs };
    });
    pad.appendChild(barrasDe(items, R.max, R.tot.gs, gs));
    card.appendChild(pad);
    return card;
  }

  function tablaEl(R){
    var card = el('div', 'card');
    var h = el('h2', null, 'Detalle por empresa');
    h.appendChild(el('span', 'hint', 'cada monto en su moneda original'));
    card.appendChild(h);

    var sc = el('div', 'scroll');
    var tb = document.createElement('table');
    var thead = document.createElement('thead');
    var htr = document.createElement('tr');
    var cols = sinTc()
      ? ['Empresa', 'Bancos', 'Inversiones', 'Total']
      : ['Empresa', 'Bancos', 'Inversiones', 'Total', '% del total'];
    cols.forEach(function(t){ htr.appendChild(el('th', null, t)); });
    thead.appendChild(htr); tb.appendChild(thead);

    var body = document.createElement('tbody');
    R.ranking.forEach(function(e){
      var tr = document.createElement('tr');
      if (!e.pyg && !e.usd) tr.className = 'nil';
      // sin la moneda en el título: cada monto ya dice en qué moneda está
      tr.appendChild(el('td', 'nm', e.nombre));
      // cada celda en su moneda original, haya o no tipo de cambio
      tr.appendChild(el('td', null, mixto(e.bancos)));
      tr.appendChild(el('td', null, mixto(e.inversiones)));
      tr.appendChild(el('td', null, mixto(e)));
      if (!sinTc()) tr.appendChild(el('td', null, pct(e.gs, R.tot.gs)));
      body.appendChild(tr);
    });

    var tot = document.createElement('tr');
    tot.className = 'tot';
    tot.appendChild(el('td', null, 'TOTAL'));
    tot.appendChild(el('td', null, mixto({ pyg:R.tot.bancosPyg, usd:R.tot.bancosUsd })));
    tot.appendChild(el('td', null, mixto({ pyg:R.tot.invPyg, usd:R.tot.invUsd })));
    tot.appendChild(el('td', null, mixto(R.tot)));
    if (!sinTc()) tot.appendChild(el('td', null, R.tot.gs ? '100,0%' : '—'));
    body.appendChild(tot);

    tb.appendChild(body);
    sc.appendChild(tb);
    card.appendChild(sc);
    return card;
  }

  function empresaEl(e, R){
    var c = el('div', 'emp');
    var eh = el('div', 'eh');
    eh.appendChild(el('div', 'en', e.nombre));
    eh.appendChild(el('div', 'ev', totalDe(e)));
    if (sinTc()){
      eh.appendChild(el('div', 'es', (e.pyg && e.usd)
        ? 'dos monedas, sin convertir'
        : ((e.pyg || e.usd) ? 'en su moneda original' : 'sin saldos')));
    } else {
      // el monto ya está arriba: acá va el equivalente en Gs. y el peso en el total
      var det = [];
      if (e.usd) det.push('\u2248 ' + gs(e.gs));
      if (e.gs) det.push(pct(e.gs, R.tot.gs) + ' del total');
      eh.appendChild(el('div', 'es', det.length ? det.join(' · ') : 'sin saldos'));
    }
    c.appendChild(eh);

    [['Bancos', 'sw-b', e.filas.bancos, e.bancos], ['Inversiones', 'sw-i', e.filas.inversiones, e.inversiones]]
    .forEach(function(p){
      var g = el('div', 'grp');
      g.appendChild(el('i', 'swatch ' + p[1]));
      g.appendChild(el('span', null, p[0]));
      if (p[3].pyg || p[3].usd) g.appendChild(el('span', 'hint', ' · ' + totalDe(p[3])));
      c.appendChild(g);
      if (!p[2].length){
        c.appendChild(el('div', 'none', 'sin filas cargadas'));
        return;
      }
      p[2].forEach(function(r){
        var ln = el('div', 'ln');
        ln.appendChild(el('div', 'l', r.label || r.ph));
        ln.appendChild(el('div', 'r', r.amount ? money(r.amount, r.currency) : '—'));
        c.appendChild(ln);
      });
    });

    // el reparto bancos/inversiones en % sólo tiene sentido si hay una moneda común
    if (!sinTc()){
      var ef = el('div', 'ef');
      ef.appendChild(el('span', null, 'Bancos / Inversiones'));
      ef.appendChild(el('b', null, (e.bancos.gs || e.inversiones.gs)
        ? pct(e.bancos.gs, e.gs) + ' / ' + pct(e.inversiones.gs, e.gs)
        : '—'));
      c.appendChild(ef);
    }
    return c;
  }

  function avisoEl(texto){
    var box = el('div', 'err');
    box.appendChild(el('b', null, 'Atención'));
    texto.split('|CODE|').forEach(function(parte, i){
      box.appendChild(i % 2 ? el('code', null, parte) : document.createTextNode(parte));
    });
    return box;
  }

  function tarjetasEl(R){
    var card = el('div', 'card');
    var h = el('h2', null, 'Dónde está la plata');
    h.appendChild(el('span', 'hint', 'bancos y fondos mutuos cargados en cada empresa'));
    card.appendChild(h);
    var pad = el('div', 'pad');
    var grid = el('div', 'emps');
    R.ranking.forEach(function(e){ grid.appendChild(empresaEl(e, R)); });

  function render(){
    var R = paintHeader();
    var view = document.getElementById('view');
    view.innerHTML = '';
    if (aviso) view.appendChild(avisoEl(aviso));

    /* =====================================================================
       ORDEN DE LA PÁGINA
       Cada línea es una sección. Para mover una de lugar, movés la línea.
       Para sacarla, le ponés // adelante (o la borrás).
       ===================================================================== */

    view.appendChild(tarjetasEl(R));  // tarjetas "Dónde está la plata"
    view.appendChild(kpisEl(R));      // los cuatro indicadores
    view.appendChild(tablaEl(R));     // tabla    "Detalle por empresa"
    view.appendChild(barrasEl(R));    // gráfico  "Total por empresa"

    var foot = document.getElementById('foot');
    foot.innerHTML = '';
    if (origen) foot.appendChild(el('div', null, 'Origen de los datos: ' + origen));
    if (LINK_DETALLE){
      var a = document.createElement('a');
      a.href = LINK_DETALLE;
      a.textContent = 'Ver el detalle fondo por fondo →';
      var d = el('div');
      d.appendChild(a);
      foot.appendChild(d);
    }
  }

  function fail(msg){
    var view = document.getElementById('view');
    view.innerHTML = '';
    view.appendChild(avisoEl(msg));
    document.getElementById('foot').innerHTML = '';
  }

  /* ---------- carga ---------- */
  function start(raw, nota, deDonde){
    try{
      state = normalize(raw);
    }catch(e){
      fail('No se pudieron leer los datos (' + e.message + '). Revisá el archivo datos.json.');
      return;
    }
    aviso = nota || '';
    origen = deDonde || '';
    render();
  }

  function conCacheBuster(url){
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now();
  }

  function traerTexto(url){
    return fetch(conCacheBuster(url), { cache:'no-store' }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    });
  }

  function cargarJson(nota){
    fetch(conCacheBuster('datos.json'), { cache:'no-store' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(raw){ start(raw, nota, 'archivo datos.json'); })
      .catch(function(){
        if (window.DATOS_RESPALDO){
          start(window.DATOS_RESPALDO, 'Mostrando los datos de respaldo incluidos en la página.', 'respaldo en la página');
        } else if (nota){
          fail(nota + ' Tampoco se pudo leer datos.json.');
        } else {
          fail('No se pudo cargar datos.json. Si abriste el archivo con doble clic, el navegador bloquea la lectura: la página tiene que estar publicada en un servidor.');
        }
      });
  }

  function textoNoEsCsv(txt){ return /^\s*</.test(txt); }

  /* --- cómo se encuentra la hoja DATOS ---------------------------------
     Si la URL publicada no trae gid, Google devuelve la PRIMERA hoja del
     documento ("Consolidado"). La página entonces se fija en la versión
     HTML del documento publicado, saca de ahí el gid de la hoja DATOS y
     reintenta con ese gid. El gid encontrado queda guardado en el navegador,
     así la próxima visita va derecho a la hoja correcta.
     --------------------------------------------------------------------- */
  var CLAVE_GID = 'panelFondos.gid.' + HOJA;

  function leerGid(){ try{ return localStorage.getItem(CLAVE_GID); }catch(e){ return null; } }
  function guardarGid(g){ try{ localStorage.setItem(CLAVE_GID, g); }catch(e){} }
  function borrarGid(){ try{ localStorage.removeItem(CLAVE_GID); }catch(e){} }

  function baseDelDoc(){
    var base = ORIGEN_CSV.split('/pub')[0];
    return (base && base !== ORIGEN_CSV) ? base : '';
  }
  function csvConGid(gid){
    var base = baseDelDoc();
    return base ? (base + '/pub?gid=' + gid + '&single=true&output=csv') : '';
  }
  function gidEnHtml(html, nombreHoja){
    var re = /gid=(\d+)[^>]*>([^<]{1,80})</g, m, objetivo = nombreHoja.trim().toLowerCase();
    while ((m = re.exec(html))){
      if (m[2].trim().toLowerCase() === objetivo) return m[1];
    }
    return null;
  }
  function buscarGidDeHoja(nombreHoja){
    var base = baseDelDoc();
    if (!base) return Promise.reject(new Error('no reconozco la forma de la URL publicada'));
    // se prueban las dos formas en las que Google sirve el documento completo
    var candidatas = [base + '/pubhtml', base + '/pub?output=html'];
    var cadena = Promise.reject(new Error('inicio'));
    candidatas.forEach(function(u){
      cadena = cadena.catch(function(){
        return traerTexto(u).then(function(html){
          var gid = gidEnHtml(html, nombreHoja);
          if (!gid) throw new Error('no encontré la hoja ' + nombreHoja + ' en el documento publicado');
          return gid;
        });
      });
    });
    return cadena.then(function(gid){
      guardarGid(gid);
      return csvConGid(gid);
    });
  }

  function intentarCsv(url){
    return traerTexto(url).then(function(txt){
      if (textoNoEsCsv(txt)) throw new Error('la URL devolvió una página HTML, no un CSV');
      try{
        return fromCsv(txt);
      }catch(e){
        e.texto = txt;   // se guarda por si hay que leer la hoja igual
        throw e;
      }
    });
  }

  function cargarPlanilla(){
    var hojaDevuelta = '', textoPrimero = '';
    var gidGuardado = leerGid();
    var primero;

    if (gidGuardado && csvConGid(gidGuardado)){
      // visitas siguientes: derecho a la hoja correcta
      primero = intentarCsv(csvConGid(gidGuardado)).catch(function(){
        borrarGid();
        return intentarCsv(ORIGEN_CSV);
      });
    } else {
      primero = intentarCsv(ORIGEN_CSV);
    }

    primero
      .catch(function(e1){
        if (e1 && e1.codigo === 'hoja-incorrecta'){
          hojaDevuelta = e1.primera || '';
          textoPrimero = e1.texto || '';
        }
        // plan B: buscar el gid de la hoja DATOS dentro del documento publicado
        return buscarGidDeHoja(HOJA).then(intentarCsv).catch(function(e2){
          // plan C: leer la hoja que sí devolvió la URL (la Consolidado)
          if (!textoPrimero) throw e2;
          var datos = fromConsolidado(textoPrimero);
          datos.__origen = 'planilla de Google · hoja Consolidado';
          datos.__aviso =
            'La URL publicada devuelve la hoja «' + (hojaDevuelta || 'Consolidado') + '», no la hoja ' + HOJA + '. ' +
            'La página está mostrando los totales de esa hoja, que sólo trae un total de bancos y uno de inversiones ' +
            'por empresa: no está el detalle banco por banco. Los fondos en dólares se reconstruyeron con el tipo de ' +
            'cambio de la celda B4, así que pueden diferir por redondeo del saldo real. ' +
            'Para verlo completo, en Google Sheets: Archivo → Compartir → Publicar en la web → elegí la hoja ' + HOJA +
            ' → CSV, y pegá esa URL en la línea |CODE|ORIGEN_CSV|CODE| de index.html y detalle.html.';
          return datos;
        });
      })
      .then(function(datos){
        start(datos, datos.__aviso || '', datos.__origen || ('planilla de Google · hoja ' + HOJA));
      })
      .catch(function(e){
        var detalle = (e && e.message) ? e.message : 'error desconocido';
        cargarJson('No se pudo leer la planilla de Google (' + detalle + ').' +
                   ' Mientras tanto se muestran los últimos números guardados en datos.json.' +
                   ' Subí |CODE|diagnostico.html|CODE| junto a esta página y abrilo: ahí dice exactamente qué está fallando.');
      });
  }

  if (ORIGEN_CSV){
    cargarPlanilla();
  } else {
    cargarJson();
  }
})();
</script>
</body>
</html>
